<svg xmlns="http://www.w3.org/2000/svg" width="760" height="680" viewBox="0 0 760 680" role="img" aria-labelledby="t">
  <title id="t">NutriSeeds Discovery Box (4 x 25g trial packets) illustration</title>
  <defs>
    <linearGradient id="boxBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdfcf6"/><stop offset=".6" stop-color="#f4eedf"/><stop offset="1" stop-color="#e7dcbe"/></linearGradient>
    <linearGradient id="boxInner" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eae0ca"/><stop offset="1" stop-color="#ded0b6"/></linearGradient>
    <linearGradient id="chiaPouch" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#e8f0eb"/></linearGradient>
    <linearGradient id="flaxPouch" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3eadb"/></linearGradient>
    <linearGradient id="pumpkinPouch" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#ecf3e6"/></linearGradient>
    <linearGradient id="sunflowerPouch" x1="0" x2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f7f0df"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="miniShadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="380" cy="615" rx="300" ry="38" fill="#4d493c" opacity=".14" filter="url(#shadow)"/>

  <!-- Outer Presentation Box (Kraft Eco Box) -->
  <g id="box-container">
    <!-- Box Back Wall -->
    <rect x="75" y="110" width="610" height="475" rx="26" fill="url(#boxBg)" stroke="#d3c5a6" stroke-width="4"/>
    <rect x="95" y="130" width="570" height="435" rx="18" fill="url(#boxInner)" stroke="#cdbe9e" stroke-width="2"/>
    
    <!-- Box Header Branding -->
    <rect x="180" y="145" width="400" height="70" rx="14" fill="#ffffff" stroke="#e0d5be" stroke-width="2"/>
    <circle cx="215" cy="180" r="19" fill="#246b45" opacity=".15"/>
    <path d="M211 189C199 184 201 168 206 163C214 170 216 179 211 189Z" fill="#1b452e"/>
    <path d="M219 188C220 176 228 170 236 171C233 182 226 189 219 188Z" fill="#d9a64b"/>
    <text x="380" y="177" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="24" text-anchor="middle" fill="#1b452e">NutriSeeds Discovery Box</text>
    <text x="380" y="199" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="3" fill="#8c7750">4 × 25g SAMPLER PACKS · 100g TOTAL</text>
  </g>

  <!-- 4 Mini 25g Pouches neatly displayed side by side -->
  <!-- 1. Chia 25g -->
  <g transform="translate(115, 235)" filter="url(#miniShadow)">
    <rect x="0" y="0" width="120" height="270" rx="12" fill="url(#chiaPouch)" stroke="#b8cbbf" stroke-width="2"/>
    <rect x="6" y="8" width="108" height="8" rx="3" fill="#d8e5dc"/>
    <circle cx="60" cy="55" r="18" fill="#246b45" opacity=".12"/>
    <text x="60" y="90" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#1b452e">CHIA</text>
    <text x="60" y="105" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="1" fill="#587661">25g PACK</text>
    <ellipse cx="60" cy="170" rx="42" ry="42" fill="#293c33"/>
    <ellipse cx="60" cy="170" rx="38" ry="38" fill="#384941"/>
    <text x="60" y="248" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#1b452e">Soak &amp; Sip</text>
  </g>

  <!-- 2. Flax 25g -->
  <g transform="translate(250, 235)" filter="url(#miniShadow)">
    <rect x="0" y="0" width="120" height="270" rx="12" fill="url(#flaxPouch)" stroke="#cfbeaa" stroke-width="2"/>
    <rect x="6" y="8" width="108" height="8" rx="3" fill="#e5dacb"/>
    <circle cx="60" cy="55" r="18" fill="#885e3d" opacity=".15"/>
    <text x="60" y="90" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#5e3e23">FLAX</text>
    <text x="60" y="105" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="1" fill="#7d5d41">25g PACK</text>
    <ellipse cx="60" cy="170" rx="42" ry="42" fill="#755134"/>
    <ellipse cx="60" cy="170" rx="38" ry="38" fill="#88603f"/>
    <text x="60" y="248" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#5e3e23">Grind &amp; Bake</text>
  </g>

  <!-- 3. Pumpkin 25g -->
  <g transform="translate(385, 235)" filter="url(#miniShadow)">
    <rect x="0" y="0" width="120" height="270" rx="12" fill="url(#pumpkinPouch)" stroke="#b5cca9" stroke-width="2"/>
    <rect x="6" y="8" width="108" height="8" rx="3" fill="#d9e8d1"/>
    <circle cx="60" cy="55" r="18" fill="#4d6f46" opacity=".15"/>
    <text x="60" y="90" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="13" text-anchor="middle" fill="#2d4926">PUMPKIN</text>
    <text x="60" y="105" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="1" fill="#4f6a49">25g PACK</text>
    <ellipse cx="60" cy="170" rx="42" ry="42" fill="#3e5936"/>
    <ellipse cx="60" cy="170" rx="38" ry="38" fill="#4f6d46"/>
    <text x="60" y="248" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#2d4926">Crunchy Salad</text>
  </g>

  <!-- 4. Sunflower 25g -->
  <g transform="translate(520, 235)" filter="url(#miniShadow)">
    <rect x="0" y="0" width="120" height="270" rx="12" fill="url(#sunflowerPouch)" stroke="#dcc594" stroke-width="2"/>
    <rect x="6" y="8" width="108" height="8" rx="3" fill="#eee1c4"/>
    <circle cx="60" cy="55" r="18" fill="#bfa058" opacity=".18"/>
    <text x="60" y="90" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="12" text-anchor="middle" fill="#6d541e">SUNFLOWER</text>
    <text x="60" y="105" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="9" text-anchor="middle" letter-spacing="1" fill="#806935">25g PACK</text>
    <ellipse cx="60" cy="170" rx="42" ry="42" fill="#a48c5b"/>
    <ellipse cx="60" cy="170" rx="38" ry="38" fill="#b9a26f"/>
    <text x="60" y="248" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#6d541e">Snack &amp; Bowl</text>
  </g>

  <!-- Box Front Lower Lip with Gold Accent -->
  <g id="box-lip">
    <path d="M75 515 C75 515, 200 528, 380 528 C560 528, 685 515, 685 515 L685 585 C685 599, 673 610, 659 610 L101 610 C87 610, 75 599, 75 585 Z" fill="#eeddbb" stroke="#cfbe98" stroke-width="3"/>
    <rect x="230" y="540" width="300" height="42" rx="21" fill="#246b45"/>
    <text x="380" y="567" font-family="Manrope, Arial, sans-serif" font-weight="800" font-size="16" text-anchor="middle" fill="#ffffff">One Complete Box · Rs. 299</text>
  </g>
</svg>
